name: CI

# Three jobs: tests -> image -> alerte.
#
# `tests` lints then runs the suite. `image` depends on it, so a red suite stops the
# build and nothing reaches the registry. Publishing the image to GHCR is the deployment
# step: the artefact that leaves the pipeline, tagged by branch and by commit.
#
# A pull request runs the same checks, builds the image and verifies it starts, but
# publishes nothing: only a push to `dev` or `main` reaches the registry.
#
# No secret is needed anywhere: publishing to GHCR authenticates with the GITHUB_TOKEN
# that GitHub mints for each run.
on:
  push:
    branches: [dev, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write   # publish the image to GHCR
  issues: write     # open an issue when the pipeline fails

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      # Python 3.13: both models are pickles produced under that version.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            api/requirements.txt
            app/requirements.txt

      # Both requirements files are pinned, scikit-learn included: a pickle does not
      # reload reliably under a version other than the one that wrote it. MLflow is
      # added because the suite checks the tracking schema; neither matplotlib nor
      # Jupyter is installed — no test needs them.
      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r api/requirements.txt -r app/requirements.txt \
            pytest httpx ruff "mlflow==3.16.1"

      # Lint first: a dead import or a broken rename fails in seconds, before the suite.
      - name: Lint
        run: ruff check .

      # The raw data is not versioned: the few tests that read the rebuilt FAO dataset
      # skip themselves here; everything else runs on generated frames.
      - name: Tests
        run: pytest -q

  image:
    name: Image Docker
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      # GHCR requires a lowercase image name, and the repository is OC_projet_DS_12.
      - name: Déterminer le nom de l'image
        id: nom
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      # Build before authenticating: a broken Dockerfile fails here, registry untouched.
      - name: Construire l'image de l'API
        run: docker build -t api:ci .

      # Smoke test: the image must answer on /health with its models loaded. Without
      # this, we would happily publish an image that does not start.
      - name: Vérifier que l'image démarre
        run: |
          docker run -d --name verif -p 8000:8000 api:ci
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/health > /tmp/sante.json; then
              cat /tmp/sante.json; echo; docker rm -f verif; exit 0
            fi
            sleep 2
          done
          echo "l'API n'a pas répondu dans le délai imparti"
          docker logs verif
          docker rm -f verif
          exit 1

      - name: Se connecter à GHCR
        if: github.event_name != 'pull_request'
        run: echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      # Two tags: the branch name for its latest image, and the short SHA to tie an
      # image back to the commit it was built from.
      - name: Publier l'image
        if: github.event_name != 'pull_request'
        run: |
          IMAGE="${{ steps.nom.outputs.image }}"
          SHA="${GITHUB_SHA::7}"
          docker tag api:ci "$IMAGE:$GITHUB_REF_NAME"
          docker tag api:ci "$IMAGE:sha-$SHA"
          docker push "$IMAGE:$GITHUB_REF_NAME"
          docker push "$IMAGE:sha-$SHA"
          echo "publié : $IMAGE:$GITHUB_REF_NAME et $IMAGE:sha-$SHA"

  alerte:
    name: Alerte en cas d'échec
    needs: [tests, image]
    # A failing pull request already shows red on the pull request itself.
    if: ${{ failure() && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest

    steps:
      # GitHub already e-mails whoever pushed. This adds an issue, which stays visible
      # in the repository and carries the link to the failing run. Only one issue is
      # ever open: further failures comment on it instead of piling up one per push.
      - uses: actions/github-script@v7
        with:
          script: |
            const titre = `La CI échoue sur ${context.ref.replace("refs/heads/", "")}`;
            const lien = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}` +
                         `/actions/runs/${context.runId}`;
            const corps = `Le run [#${context.runNumber}](${lien}) a échoué sur le commit ` +
                          `${context.sha.slice(0, 7)}.`;

            const ouvertes = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: "open", labels: "ci",
            });

            if (ouvertes.data.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: ouvertes.data[0].number, body: corps,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title: titre, body: corps, labels: ["ci"],
              });
            }
