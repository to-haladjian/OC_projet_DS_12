[project]
name = "agritech-crop-recommender"
version = "0.1.0"
description = "Crop yield prediction and crop recommendation system for Agritech Answers"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "scipy>=1.12",
    "scikit-learn>=1.4",
    "joblib>=1.3",
    "mlflow>=3.0",
]

[project.optional-dependencies]
notebook = [
    "jupyter>=1.0",
    "ipykernel>=6.29",
    "nbconvert>=7.16",
]
api = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
]
app = [
    "streamlit>=1.50",
    "requests>=2.32",
]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]
# Deploiement du Space Hugging Face (etape 5) : utilise par le pipeline et par
# deploy/pousse_espace.py, pas par l'application.
deploy = [
    "huggingface_hub>=0.25",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Arborescence plate : api/, app/ et src/ sont a la racine et ne sont pas installes.
# Sans cette ligne, `pytest` echoue a importer `api` alors que `python -m pytest`
# fonctionne, le second ajoutant le repertoire courant a sys.path et le premier pas.
pythonpath = ["."]
filterwarnings = [
    # Starlette's TestClient announces its move away from httpx; harmless here.
    "ignore::DeprecationWarning:fastapi.testclient",
    "ignore:Using `httpx` with `starlette.testclient`",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
